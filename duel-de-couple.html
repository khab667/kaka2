<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel de Couple</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: #4d4d4d;
    color: #fff;
    transition: background-color .6s ease;
    overflow-x: hidden;
  }
  #app { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .screen { width: 100%; max-width: 760px; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  h1 { font-size: clamp(30px, 6vw, 52px); font-weight: 800; line-height: 1.15; }
  h2 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; margin-bottom: 12px; }
  p  { line-height: 1.5; }
  .center { text-align: center; }
  .muted { opacity: .7; }
  .brand { text-align: center; font-weight: 700; font-size: 22px; opacity: .5; margin-bottom: 14px; letter-spacing: .3px; }

  /* ---------- Boutons & champs ---------- */
  button {
    font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 999px;
    padding: 14px 26px; font-size: 17px; background: #fff; color: #222;
    transition: transform .12s ease, opacity .2s ease, background .2s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0) scale(.98); }
  button:focus-visible, input:focus-visible, .bar:focus-visible { outline: 3px solid #ffd54a; outline-offset: 3px; }
  button.ghost { background: rgba(255,255,255,.14); color: #fff; }
  button.ghost:hover { background: rgba(255,255,255,.24); }
  button.small { padding: 8px 14px; font-size: 14px; }
  button.danger { background: rgba(0,0,0,.35); color: #ffb3b3; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
  .row.left { justify-content: flex-start; }

  input[type=text] {
    font: inherit; font-size: 18px; color: #fff; width: 100%;
    background: rgba(0,0,0,.28); border: 2px solid rgba(255,255,255,.18);
    border-radius: 14px; padding: 12px 16px;
  }
  input[type=text]::placeholder { color: rgba(255,255,255,.45); }
  label.field { display: block; font-weight: 700; margin-bottom: 6px; opacity: .85; }

  .card { background: rgba(0,0,0,.22); border-radius: 22px; padding: 22px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

  /* ---------- Accueil ---------- */
  .steps { list-style: none; display: grid; gap: 10px; margin-top: 18px; }
  .steps li { display: flex; gap: 12px; align-items: flex-start; }
  .steps b.n { flex: 0 0 28px; height: 28px; border-radius: 50%; background: #fff; color: #333; display: grid; place-items: center; font-size: 14px; }
  .catline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: rgba(255,255,255,.14); border-radius: 999px; padding: 5px 12px; font-size: 14px; }

  /* ---------- Barre de note ---------- */
  .bar {
    position: relative; height: 28px; border-radius: 14px; background: rgba(0,0,0,.6);
    overflow: hidden; cursor: pointer; touch-action: none; user-select: none;
  }
  .bar .fill { position: absolute; top: 0; left: 0; bottom: 0; width: 0; background: #fff; border-radius: 14px; transition: width .25s ease; }
  .bar.dragging .fill { transition: none; }
  .bar .ticks { position: absolute; inset: 0; display: flex; pointer-events: none; }
  .bar .ticks span { flex: 1; border-right: 2px solid rgba(0,0,0,.12); }
  .bar .ticks span:last-child { border-right: 0; }

  .rate .top { display: flex; justify-content: space-between; font-weight: 700; opacity: .75; margin-bottom: 70px; gap: 12px; flex-wrap: wrap; }
  .rate .note { display: flex; align-items: baseline; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .rate .note .val { font-size: 64px; font-weight: 800; line-height: 1; }
  .rate .note .comment { font-size: 22px; font-weight: 700; opacity: .9; }
  .rate h1 { margin-top: 70px; }
  .quick { display: flex; gap: 6px; margin-top: 18px; flex-wrap: wrap; }
  .quick button { padding: 8px 0; width: 44px; font-size: 15px; background: rgba(0,0,0,.25); color: #fff; }
  .quick button.on { background: #fff; color: #222; }
  .hint { margin-top: 18px; font-size: 14px; opacity: .6; }

  /* ---------- Révélation ---------- */
  .duo { display: grid; gap: 22px; margin-top: 36px; }
  .duo .who { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; font-size: 18px; }
  .duo .who .num { font-size: 22px; }
  .verdict-line { margin-top: 30px; font-size: 22px; font-weight: 700; }

  /* ---------- Résultat final ---------- */
  .winner { font-size: clamp(26px, 5vw, 40px); font-weight: 800; text-align: center; margin: 8px 0 26px; }
  .pct { font-size: 58px; font-weight: 800; line-height: 1; margin: 10px 0 6px; }
  .tag { display: inline-block; background: #fff; color: #222; border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 15px; }
  .kv { margin-top: 14px; display: grid; gap: 6px; font-size: 15px; }
  .kv b { opacity: .7; font-weight: 600; }
  .table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; }
  .table th, .table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.12); }
  .table td.n, .table th.n { text-align: center; width: 70px; }
  .gap-hot { color: #ffd54a; font-weight: 800; }

  /* ---------- Éditeur de catégories ---------- */
  .catlist { display: grid; gap: 10px; margin-top: 16px; max-height: 52vh; overflow-y: auto; padding-right: 4px; }
  .catrow { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; }
  .catrow input.emoji { text-align: center; padding: 12px 6px; }
  .error { color: #ffd54a; font-weight: 700; margin-top: 12px; min-height: 1.4em; }

  .confetti { position: fixed; top: -20px; font-size: 26px; pointer-events: none; animation: fall linear forwards; z-index: 10; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .8; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DUEL DE COUPLE — chacun note l'autre en secret,
   puis on révèle les notes catégorie par catégorie.
   ========================================================= */

const DEFAULT_CATS = [
  { emoji: "🧠", name: "Se souvenir des petites choses" },
  { emoji: "🌦️", name: "Gérer mes sautes d'humeur" },
  { emoji: "🎁", name: "Les cadeaux" },
  { emoji: "😂", name: "Me faire rire" },
  { emoji: "💋", name: "Les bisous" },
  { emoji: "👂", name: "L'écoute" },
  { emoji: "💬", name: "Les SMS" },
];

const PALETTE = ["#7a0000", "#00117a", "#004a7a", "#007a5f", "#7a3500", "#157a00",
                 "#5b007a", "#7a0050", "#00627a", "#6b5a00"];
const NEUTRAL = "#4d4d4d";
const COMMENTS = ["Catastrophe 💀", "Aïe… 😬", "Très bof 😕", "Bof 🤨", "Moyen 😐", "Correct 🙂",
                  "Pas mal 😊", "Bien 😄", "Très bien 😍", "Excellent 🔥", "Parfait 👑"];
const STORE_KEY = "duelDeCouple.v1";

const S = {
  names: ["", ""],
  cats: DEFAULT_CATS.map(c => ({ ...c })),
  ratings: [[], []],   // ratings[r][i] = note donnée par le joueur r à l'autre, catégorie i
  rater: 0, idx: 0, reveal: 0,
  onKey: null,
};

/* ---------- Sauvegarde locale (facultative) ---------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (d && Array.isArray(d.cats) && d.cats.length) S.cats = d.cats;
    if (d && Array.isArray(d.names)) S.names = d.names;
  } catch (e) { /* stockage indisponible : on garde les valeurs par défaut */ }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ cats: S.cats, names: S.names })); } catch (e) {}
}

/* ---------- Utilitaires ---------- */
const $ = sel => document.querySelector(sel);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = i => PALETTE[i % PALETTE.length];
const other = p => 1 - p;
function setBg(c) { document.body.style.backgroundColor = c; }
function show(html, bg, onKey) {
  setBg(bg);
  app.innerHTML = `<div class="screen">${html}</div>`;
  S.onKey = onKey || null;
  window.scrollTo(0, 0);
  const f = app.querySelector("[autofocus]");
  if (f) f.focus();
}
document.addEventListener("keydown", e => { if (S.onKey) S.onKey(e); });

function catLabel(c) { return `${c.emoji ? esc(c.emoji) + " " : ""}${esc(c.name)}`; }
function received(p) { return S.ratings[other(p)]; }   // notes reçues par le joueur p
function percent(p) {
  const arr = received(p);
  const sum = arr.reduce((a, b) => a + b, 0);
  return Math.round(sum / (S.cats.length * 10) * 100);
}
function verdict(pct) {
  if (pct >= 90) return "Partenaire légendaire 👑";
  if (pct >= 75) return "Valeur sûre 💖";
  if (pct >= 60) return "Peut mieux faire 😅";
  if (pct >= 40) return "Il va falloir bosser 📚";
  return "Alerte rouge 🚨";
}

/* =========================================================
   ÉCRAN 1 — Accueil
   ========================================================= */
function home() {
  const chips = S.cats.map(c => `<span class="chip">${catLabel(c)}</span>`).join("");
  show(`
    <div class="center">
      <div class="brand">💞 Duel de Couple</div>
      <h1>Qui est le meilleur partenaire&nbsp;?</h1>
      <p class="muted" style="margin-top:10px">Notez-vous l'un l'autre en secret, puis découvrez les résultats ensemble.</p>
    </div>
    <div class="card" style="margin-top:28px">
      <div class="grid2">
        <div><label class="field" for="n0">Joueur 1</label><input type="text" id="n0" maxlength="20" placeholder="Prénom" value="${esc(S.names[0])}" autofocus></div>
        <div><label class="field" for="n1">Joueur 2</label><input type="text" id="n1" maxlength="20" placeholder="Prénom" value="${esc(S.names[1])}"></div>
      </div>
      <div class="catline">
        <b>${S.cats.length} catégorie${S.cats.length > 1 ? "s" : ""}</b>
        <button class="ghost small" id="edit">✏️ Personnaliser les catégories</button>
      </div>
      <div class="chips">${chips}</div>
    </div>
    <ul class="steps">
      <li><b class="n">1</b><span>Le joueur 1 note le joueur 2 sur chaque catégorie (de 0 à 10). L'autre ne regarde pas&nbsp;!</span></li>
      <li><b class="n">2</b><span>On échange : le joueur 2 note le joueur 1.</span></li>
      <li><b class="n">3</b><span>Révélation des notes une par une, puis verdict final.</span></li>
    </ul>
    <div class="row"><button id="go">Commencer le duel →</button></div>
  `, NEUTRAL, e => { if (e.key === "Enter") start(); });

  $("#edit").onclick = () => { readNames(); editor(); };
  $("#go").onclick = start;
}
function readNames() {
  if ($("#n0")) S.names = [$("#n0").value.trim(), $("#n1").value.trim()];
}
function start() {
  readNames();
  if (!S.names[0]) S.names[0] = "Joueur 1";
  if (!S.names[1]) S.names[1] = "Joueur 2";
  if (S.names[0].toLowerCase() === S.names[1].toLowerCase()) S.names[1] += " (2)";
  save();
  S.ratings = [S.cats.map(() => 5), S.cats.map(() => 5)];
  handoff(0);
}

/* =========================================================
   ÉCRAN 2 — Éditeur de catégories
   ========================================================= */
function editor() {
  let draft = S.cats.map(c => ({ ...c }));

  const rows = () => draft.map((c, i) => `
    <div class="catrow">
      <input type="text" class="emoji" data-i="${i}" data-k="emoji" maxlength="4" value="${esc(c.emoji)}" aria-label="Emoji">
      <input type="text" data-i="${i}" data-k="name" maxlength="50" value="${esc(c.name)}" placeholder="Nom de la catégorie" aria-label="Nom">
      <button class="danger small" data-del="${i}" title="Supprimer">✕</button>
    </div>`).join("");

  function paint() {
    $("#list").innerHTML = rows();
    $("#list").querySelectorAll("input").forEach(inp => {
      inp.oninput = () => { draft[+inp.dataset.i][inp.dataset.k] = inp.value; };
    });
    $("#list").querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => { draft.splice(+b.dataset.del, 1); paint(); };
    });
    $("#count").textContent = `${draft.length} / 30`;
  }

  show(`
    <h2>✏️ Tes catégories</h2>
    <p class="muted">Garde celles de base, modifie-les ou ajoute les tiennes (emoji facultatif).</p>
    <div class="catlist" id="list"></div>
    <div class="row left">
      <button class="ghost small" id="add">＋ Ajouter</button>
      <button class="ghost small" id="reset">↺ Catégories de base</button>
      <span class="muted" id="count" style="align-self:center"></span>
    </div>
    <div class="error" id="err"></div>
    <div class="row">
      <button class="ghost" id="cancel">Annuler</button>
      <button id="ok">Enregistrer</button>
    </div>
  `, NEUTRAL);

  paint();
  $("#add").onclick = () => {
    if (draft.length >= 30) { $("#err").textContent = "30 catégories maximum."; return; }
    draft.push({ emoji: "⭐", name: "" });
    paint();
    const inputs = $("#list").querySelectorAll('input[data-k="name"]');
    inputs[inputs.length - 1].focus();
  };
  $("#reset").onclick = () => { draft = DEFAULT_CATS.map(c => ({ ...c })); paint(); };
  $("#cancel").onclick = home;
  $("#ok").onclick = () => {
    const clean = draft.map(c => ({ emoji: c.emoji.trim(), name: c.name.trim() })).filter(c => c.name);
    if (!clean.length) { $("#err").textContent = "Il faut au moins une catégorie avec un nom."; return; }
    S.cats = clean;
    save();
    home();
  };
}

/* =========================================================
   ÉCRAN 3 — Passage de l'écran
   ========================================================= */
function handoff(r) {
  S.rater = r; S.idx = 0;
  const me = esc(S.names[r]), you = esc(S.names[other(r)]);
  show(`
    <div class="center">
      <div class="brand">💞 Duel de Couple · Manche ${r + 1} / 2</div>
      <h1>🔒 Au tour de ${me}</h1>
      <p style="margin-top:16px;font-size:20px">${me}, prends le clavier et note <b>${you}</b>.</p>
      <p class="muted" style="margin-top:8px;font-size:18px">${you}, ne regarde pas l'écran 👀</p>
      <div class="row"><button id="go" autofocus>Je suis ${me}, c'est parti →</button></div>
    </div>
  `, NEUTRAL, e => { if (e.key === "Enter") { e.preventDefault(); rate(); } });
  $("#go").onclick = rate;
}

/* =========================================================
   ÉCRAN 4 — Notation (barre + catégorie)
   ========================================================= */
function rate() {
  const r = S.rater, i = S.idx, n = S.cats.length;
  const c = S.cats[i];
  const quick = Array.from({ length: 11 }, (_, v) => `<button data-v="${v}">${v}</button>`).join("");

  show(`
    <div class="rate">
      <div class="top"><span>${esc(S.names[r])} note ${esc(S.names[other(r)])}</span><span>${i + 1} / ${n}</span></div>
      <div class="brand">💞 Duel de Couple</div>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Note" aria-valuemin="0" aria-valuemax="10">
        <div class="fill"></div>
        <div class="ticks">${"<span></span>".repeat(10)}</div>
      </div>
      <div class="note"><span class="val" id="val"></span><span class="muted" style="font-size:24px;font-weight:700">/10</span><span class="comment" id="cm"></span></div>
      <div class="quick">${quick}</div>
      <h1>${catLabel(c)}</h1>
      <div class="hint">Clique ou glisse sur la barre · ← → pour ajuster · Entrée pour valider</div>
      <div class="row">
        <button class="ghost" id="back">← Retour</button>
        <button id="ok">${i === n - 1 ? "Terminer ✓" : "Valider →"}</button>
      </div>
    </div>
  `, color(i), e => {
    // Entrée sur Retour/Valider : laisser le bouton agir (sauf sur les pastilles 0-10)
    if (e.key === "Enter" && e.target.tagName === "BUTTON" && !e.target.dataset.v) return;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); set(get() + 1); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); set(get() - 1); }
    else if (e.key === "Home") set(0);
    else if (e.key === "End") set(10);
    else if (e.key === "Enter") { e.preventDefault(); next(); }
    else if (e.key === "Backspace" || e.key === "Escape") { e.preventDefault(); back(); }
  });

  const bar = $("#bar");
  const get = () => S.ratings[r][i];
  function set(v) {
    v = Math.max(0, Math.min(10, v));
    S.ratings[r][i] = v;
    bar.querySelector(".fill").style.width = (v * 10) + "%";
    bar.setAttribute("aria-valuenow", v);
    $("#val").textContent = v;
    $("#cm").textContent = COMMENTS[v];
    app.querySelectorAll(".quick button").forEach(b => b.classList.toggle("on", +b.dataset.v === v));
  }
  set(get());

  const pick = e => {
    const rect = bar.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
    set(Math.round(x / rect.width * 10));
  };
  bar.addEventListener("pointerdown", e => { bar.setPointerCapture(e.pointerId); bar.classList.add("dragging"); pick(e); });
  bar.addEventListener("pointermove", e => { if (bar.hasPointerCapture(e.pointerId)) pick(e); });
  bar.addEventListener("pointerup", () => bar.classList.remove("dragging"));
  bar.addEventListener("pointercancel", () => bar.classList.remove("dragging"));
  app.querySelectorAll(".quick button").forEach(b => b.onclick = () => set(+b.dataset.v));

  function next() {
    if (i < n - 1) { S.idx++; rate(); }
    else if (r === 0) handoff(1);
    else revealIntro();
  }
  function back() {
    if (i > 0) { S.idx--; rate(); }
    else handoff(r);
  }
  $("#ok").onclick = next;
  $("#back").onclick = back;
}

/* =========================================================
   ÉCRAN 5 — Révélation catégorie par catégorie
   ========================================================= */
function revealIntro() {
  show(`
    <div class="center">
      <div class="brand">💞 Duel de Couple</div>
      <h1>🎬 L'heure de vérité</h1>
      <p style="margin-top:16px;font-size:20px">Installez-vous tous les deux devant l'écran.</p>
      <div class="row">
        <button class="ghost" id="skip">Voir directement le résultat</button>
        <button id="go" autofocus>Révéler les notes →</button>
      </div>
    </div>
  `, NEUTRAL, e => { if (e.key === "Enter") { e.preventDefault(); reveal(0); } });
  $("#go").onclick = () => reveal(0);
  $("#skip").onclick = final;
}

function reveal(i) {
  const n = S.cats.length, c = S.cats[i];
  const a = received(0)[i], b = received(1)[i];   // notes reçues par J1 et J2
  const [n0, n1] = S.names.map(esc);
  let line;
  const d = Math.abs(a - b);
  if (d === 0) line = "Égalité parfaite 🤝";
  else {
    const best = a > b ? n0 : n1;
    if (d >= 4) line = `Gros écart ! ${best} écrase le match 😱`;
    else if (d >= 2) line = `Avantage ${best} 💪`;
    else line = `${best} gagne d'un cheveu 🤏`;
  }

  const row = (name, giver, v) => `
    <div>
      <div class="who"><span>${name} <span class="muted" style="font-weight:400">(noté par ${giver})</span></span><span class="num">${v}/10</span></div>
      <div class="bar" style="cursor:default"><div class="fill" data-w="${v * 10}"></div></div>
    </div>`;

  show(`
    <div class="rate">
      <div class="top"><span>Révélation</span><span>${i + 1} / ${n}</span></div>
      <h1 style="margin-top:0">${catLabel(c)}</h1>
      <div class="duo">
        ${row(n0, n1, a)}
        ${row(n1, n0, b)}
      </div>
      <div class="verdict-line">${line}</div>
      <div class="row">
        ${i > 0 ? '<button class="ghost" id="prev">← Précédent</button>' : ""}
        <button id="next" autofocus>${i === n - 1 ? "Résultat final 🏆" : "Suivant →"}</button>
      </div>
    </div>
  `, color(i), e => {
    if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); go(); }
    else if (e.key === "ArrowLeft" && i > 0) reveal(i - 1);
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    app.querySelectorAll(".fill[data-w]").forEach(f => f.style.width = f.dataset.w + "%");
  }));
  const go = () => (i < n - 1 ? reveal(i + 1) : final());
  $("#next").onclick = go;
  if (i > 0) $("#prev").onclick = () => reveal(i - 1);
}

/* =========================================================
   ÉCRAN 6 — Résultat final
   ========================================================= */
function final() {
  const p = [percent(0), percent(1)];
  const [n0, n1] = S.names.map(esc);
  let title;
  if (p[0] === p[1]) title = "🤝 Égalité parfaite ! Vous êtes faits l'un pour l'autre.";
  else title = `🏆 ${p[0] > p[1] ? n0 : n1} remporte le duel !`;

  const extremes = pl => {
    const arr = received(pl);
    const max = Math.max(...arr), min = Math.min(...arr);
    const best = S.cats.filter((_, i) => arr[i] === max).map(catLabel).join(", ");
    const worst = S.cats.filter((_, i) => arr[i] === min).map(catLabel).join(", ");
    return { best, worst, max, min };
  };

  const card = pl => {
    const x = extremes(pl);
    return `
      <div class="card">
        <div style="font-size:20px;font-weight:800">${esc(S.names[pl])}</div>
        <div class="pct">${p[pl]}%</div>
        <span class="tag">${verdict(p[pl])}</span>
        <div class="kv">
          <div><b>Point fort :</b> ${x.best} (${x.max}/10)</div>
          <div><b>À travailler :</b> ${x.worst} (${x.min}/10)</div>
        </div>
      </div>`;
  };

  const rows = S.cats.map((c, i) => {
    const a = received(0)[i], b = received(1)[i];
    const hot = Math.abs(a - b) >= 3;
    return `<tr><td>${catLabel(c)}</td><td class="n">${a}</td><td class="n">${b}</td>
            <td class="n ${hot ? "gap-hot" : ""}">${hot ? "⚠️ " : ""}${Math.abs(a - b)}</td></tr>`;
  }).join("");
  const talk = S.cats.filter((_, i) => Math.abs(received(0)[i] - received(1)[i]) >= 3).length;

  show(`
    <div class="brand">💞 Duel de Couple · Résultat</div>
    <div class="winner">${title}</div>
    <div class="grid2">${card(0)}${card(1)}</div>
    <div class="card" style="margin-top:16px">
      <b>Détail des notes reçues</b>
      <table class="table">
        <thead><tr><th>Catégorie</th><th class="n">${n0}</th><th class="n">${n1}</th><th class="n">Écart</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="muted" style="margin-top:12px">${talk
        ? `⚠️ ${talk} sujet${talk > 1 ? "s" : ""} avec un gros écart : parfait pour en discuter ensemble 😉`
        : "Aucun gros écart : vous êtes sur la même longueur d'onde ✨"}</p>
    </div>
    <div class="row">
      <button class="ghost" id="home">Accueil</button>
      <button class="ghost" id="revoir">Revoir la révélation</button>
      <button id="again" autofocus>Rejouer 🔁</button>
    </div>
  `, NEUTRAL);

  $("#home").onclick = home;
  $("#revoir").onclick = () => reveal(0);
  $("#again").onclick = start;
  confetti();
}

function confetti() {
  const emojis = ["💖", "✨", "🎉", "💞", "⭐"];
  for (let k = 0; k < 28; k++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = emojis[k % emojis.length];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (2.2 + Math.random() * 2) + "s";
    el.style.animationDelay = Math.random() * .8 + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5200);
  }
}

/* ---------- Lancement ---------- */
load();
home();
</script>
</body>
</html>
